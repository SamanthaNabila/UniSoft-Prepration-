<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Task Manager</h1>
    <button id="new-task-btn" class="btn btn-primary">+ New Task</button>
  </header>

  <main class="container">
    <section class="dashboard" aria-label="Dashboard">
      <div class="stat-card">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-pending">0</span>
        <span class="stat-label">Pending</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-completed">0</span>
        <span class="stat-label">Completed</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-high">0</span>
        <span class="stat-label">High priority</span>
      </div>
    </section>

    <section class="toolbar">
      <input type="search" id="search-input" placeholder="Search by title..." />
      <select id="filter-status">
        <option value="">All statuses</option>
        <option value="pending">Pending</option>
        <option value="completed">Completed</option>
      </select>
      <select id="filter-priority">
        <option value="">All priorities</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
      <select id="sort-by">
        <option value="created_desc">Newest first</option>
        <option value="created_asc">Oldest first</option>
        <option value="due_asc">Due date &uarr;</option>
        <option value="due_desc">Due date &darr;</option>
      </select>
      <button id="clear-filters" class="btn">Clear</button>
    </section>

    <p id="message" class="message" hidden></p>

    <section id="task-list" class="task-list" aria-label="Task list"></section>
    <p id="empty-state" class="empty-state" hidden>No tasks match your filters.</p>
  </main>

  <dialog id="task-dialog">
    <form id="task-form" method="dialog">
      <h2 id="dialog-title">New Task</h2>

      <label>
        Title <span class="required">*</span>
        <input type="text" name="title" id="field-title" maxlength="200" required />
      </label>

      <label>
        Description
        <textarea name="description" id="field-description" rows="3" maxlength="2000"></textarea>
      </label>

      <div class="form-row">
        <label>
          Priority
          <select name="priority" id="field-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </label>
        <label>
          Status
          <select name="status" id="field-status">
            <option value="pending" selected>Pending</option>
            <option value="completed">Completed</option>
          </select>
        </label>
        <label>
          Due date
          <input type="date" name="due_date" id="field-due-date" />
        </label>
      </div>

      <p id="form-error" class="form-error" hidden></p>

      <div class="dialog-actions">
        <button type="button" id="dialog-cancel" class="btn">Cancel</button>
        <button type="submit" id="dialog-save" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
